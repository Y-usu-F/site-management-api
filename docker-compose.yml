version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitebys-api
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env.docker.example
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_writable:/var/www/html/writable
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sitebys-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: sitebys-mysql
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bys
      MYSQL_USER: bys
      MYSQL_PASSWORD: bys
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - sitebys-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sitebys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sitebys-network
    restart: unless-stopped

networks:
  sitebys-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  backend_writable:

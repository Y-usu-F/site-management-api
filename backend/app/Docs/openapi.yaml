    put: { tags: [SiteManagement], summary: Update block, security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/IdPath' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockPayload' } } } }, responses: { '200': { description: Basarili, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }, '401': { $ref: '#/components/responses/Error401' }, '403': { $ref: '#/components/responses/Error403' }, '422': { $ref: '#/components/responses/Error422' } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              $ref: '#/components/examples/Error401Example'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              $ref: '#/components/examples/Error403Example'
    Error422:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              $ref: '#/components/examples/Error422Example'
    Error500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            internal:
              $ref: '#/components/examples/Error500Example'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    SuccessEnvelope:
      type: object
      required: [success, message, data, errors, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
        errors:
          nullable: true
        meta:
          type: object
          properties:
            request_id:
              type: string
              nullable: true
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, meta]
              properties:
                items:
                  type: array
                  items:
                    type: object
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
    ErrorEnvelope:
      type: object
      required: [success, message, data, errors, meta]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null
        errors:
          type: object
          required: [error_code]
          properties:
            error_code:
              type: string
            details:
              nullable: true
        meta:
          type: object
          properties:
            request_id:
              type: string
              nullable: true
    AuthSuccessEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                token_type:
                  type: string
                  example: Bearer
                expires_in:
                  type: integer
                refresh_token:
                  type: string
                refresh_expires_in:
                  type: integer
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                    company_id:
                      type: integer
                    email:
                      type: string
                    roles:
                      type: array
                      items:
                        type: string
    SitePayload:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        address: { type: string }
        status: { type: string, enum: [active, passive] }
    BlockPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        name: { type: string }
        code: { type: string }
        sort_order: { type: integer }
        status: { type: string, enum: [active, passive] }
    FloorPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        block_id: { type: integer, minimum: 1 }
        number: { type: integer }
        label: { type: string }
        sort_order: { type: integer }
        status: { type: string, enum: [active, passive] }
    UnitPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        block_id: { type: integer, minimum: 1 }
        floor_id: { type: integer, minimum: 1 }
        unit_no: { type: string }
        type: { type: string }
        gross_area: { type: number, format: float }
        net_area: { type: number, format: float }
        occupant_name: { type: string }
        status: { type: string, enum: [active, passive] }
    ResidentProfilePayload:
      type: object
      properties:
        user_id: { type: integer, minimum: 1 }
        first_name: { type: string }
        last_name: { type: string }
        identity_number: { type: string }
        phone: { type: string }
        email: { type: string }
        birth_date: { type: string, format: date }
        status: { type: string, enum: [active, passive] }
    UnitOccupancyPayload:
      type: object
      properties:
        unit_id: { type: integer, minimum: 1 }
        resident_profile_id: { type: integer, minimum: 1 }
        relationship_type: { type: string, enum: [owner, tenant, resident, family_member] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_primary: { type: boolean }
        status: { type: string, enum: [active, passive] }
    ResidentContactPayload:
      type: object
      properties:
        resident_profile_id: { type: integer, minimum: 1 }
        type: { type: string, enum: [phone, email, emergency] }
        label: { type: string }
        value: { type: string }
        is_primary: { type: boolean }
    ResidentVehiclePayload:
      type: object
      properties:
        resident_profile_id: { type: integer, minimum: 1 }
        unit_id: { type: integer, minimum: 1, nullable: true }
        plate_number: { type: string }
        brand: { type: string }
        model: { type: string }
        color: { type: string }
        parking_slot: { type: string }
        status: { type: string, enum: [active, passive] }
    DueDefinitionPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1, nullable: true }
        block_id: { type: integer, minimum: 1, nullable: true }
        name: { type: string }
        code: { type: string }
        calculation_type: { type: string, enum: [fixed, unit_area, land_share, resident_count] }
        amount: { type: number, format: float }
        currency: { type: string }
        status: { type: string, enum: [active, passive] }
    DuePeriodPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        period_key: { type: string, example: "2026-05" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        due_date: { type: string, format: date }
        status: { type: string, enum: [draft, open, closed, locked] }
    DueBatchPayload:
      type: object
      properties:
        due_definition_id: { type: integer, minimum: 1 }
        due_period_id: { type: integer, minimum: 1 }
    DueItemPayload:
      type: object
      properties:
        description: { type: string }
        paid_amount: { type: number, format: float }
    PaymentManualPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        unit_id: { type: integer, minimum: 1, nullable: true }
        resident_profile_id: { type: integer, minimum: 1, nullable: true }
        idempotency_key: { type: string }
        amount: { type: number, format: float }
        currency: { type: string }
        payment_date: { type: string, format: date-time }
        method: { type: string, enum: [cash, bank_transfer, credit_card, online] }
        description: { type: string }
    RequestCategoryPayload:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, passive] }
    ServiceRequestPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        block_id: { type: integer, minimum: 1, nullable: true }
        unit_id: { type: integer, minimum: 1, nullable: true }
        resident_profile_id: { type: integer, minimum: 1, nullable: true }
        category_id: { type: integer, minimum: 1, nullable: true }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        source: { type: string, enum: [panel, mobile, admin] }
    ServiceRequestCommentPayload:
      type: object
      properties:
        comment: { type: string }
        visibility: { type: string, enum: [internal, public] }
    ServiceRequestFilePayload:
      type: object
      properties:
        file_name: { type: string }
        file_path: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
    WorkOrderPayload:
      type: object
      properties:
        service_request_id: { type: integer, minimum: 1 }
        assigned_to_user_id: { type: integer, minimum: 1, nullable: true }
        vendor_name: { type: string }
        planned_start_at: { type: string, format: date-time }
        planned_end_at: { type: string, format: date-time }
        cost_amount: { type: number, format: float }
        currency: { type: string }
        notes: { type: string }
    NotificationTemplatePayload:
      type: object
      properties:
        code: { type: string }
        channel: { type: string, enum: [in_app, email, sms] }
        locale: { type: string, example: "tr" }
        subject: { type: string, nullable: true }
        body: { type: string }
        status: { type: string, enum: [active, passive] }
    NotificationMessagePayload:
      type: object
      properties:
        template_id: { type: integer, minimum: 1, nullable: true }
        channel: { type: string, enum: [in_app, email, sms] }
        subject: { type: string, nullable: true }
        body: { type: string }
        payload_json: { type: object, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
    CommunicationProviderPayload:
      type: object
      properties:
        channel: { type: string, enum: [email, sms] }
        provider_name: { type: string }
        config_json: { type: object, nullable: true }
        is_default: { type: boolean }
        status: { type: string, enum: [active, passive] }
    AnnouncementPayload:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        publish_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        targets:
          type: array
          items:
            type: object
            properties:
              target_type: { type: string, enum: [site, block, unit, role, resident, all] }
              target_id: { type: string, nullable: true }
    CommonAreaPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        name: { type: string }
        code: { type: string, nullable: true }
        description: { type: string, nullable: true }
        capacity: { type: integer, minimum: 1, nullable: true }
        requires_approval: { type: boolean }
        is_paid: { type: boolean }
        fee_amount: { type: number, format: float, nullable: true }
        currency: { type: string }
        status: { type: string, enum: [active, passive] }
    CommonAreaReservationPayload:
      type: object
      properties:
        common_area_id: { type: integer, minimum: 1 }
        unit_id: { type: integer, minimum: 1, nullable: true }
        resident_profile_id: { type: integer, minimum: 1, nullable: true }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        participant_count: { type: integer, minimum: 1, nullable: true }
        notes: { type: string, nullable: true }
    MeterPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        block_id: { type: integer, minimum: 1, nullable: true }
        unit_id: { type: integer, minimum: 1, nullable: true }
        meter_no: { type: string, nullable: true }
        meter_type: { type: string, enum: [electricity, water, natural_gas, heat, other] }
        scope: { type: string, enum: [site, block, unit] }
        name: { type: string, nullable: true }
        status: { type: string, enum: [active, passive] }
    MeterReadingPeriodPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        period_key: { type: string, example: "2026-05" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [draft, open, closed, locked] }
    MeterReadingPayload:
      type: object
      properties:
        meter_id: { type: integer, minimum: 1 }
        reading_period_id: { type: integer, minimum: 1 }
        previous_index: { type: number, format: float }
        current_index: { type: number, format: float }
        unit_price: { type: number, format: float, nullable: true }
        reading_date: { type: string, format: date }
        source: { type: string, enum: [admin, resident, import] }
        status: { type: string, enum: [pending, approved] }
        photo_path: { type: string, nullable: true }
    AssetPayload:
      type: object
      properties:
        site_id: { type: integer, minimum: 1 }
        block_id: { type: integer, minimum: 1, nullable: true }
        unit_id: { type: integer, minimum: 1, nullable: true }
        asset_no: { type: string, nullable: true }
        asset_type: { type: string, enum: [elevator, generator, camera, fire_system, hydrophore, door_system, garden_equipment, cleaning_equipment, other] }
        name: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serial_number: { type: string, nullable: true }
        purchase_date: { type: string, format: date, nullable: true }
        warranty_until: { type: string, format: date, nullable: true }
        location_note: { type: string, nullable: true }
        status: { type: string, enum: [active, maintenance, broken, retired] }
    AssetMaintenancePlanPayload:
      type: object
      properties:
        asset_id: { type: integer, minimum: 1 }
        frequency_type: { type: string, enum: [daily, weekly, monthly, quarterly, yearly, custom] }
        frequency_interval: { type: integer, minimum: 1 }
        next_due_date: { type: string, format: date }
        vendor_name: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [active, paused, cancelled] }
    AssetMaintenanceRecordPayload:
      type: object
      properties:
        asset_id: { type: integer, minimum: 1 }
        maintenance_plan_id: { type: integer, minimum: 1, nullable: true }
        work_order_id: { type: integer, minimum: 1, nullable: true }
        performed_at: { type: string, format: date-time }
